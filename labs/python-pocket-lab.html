<!doctype html>
<html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>دفتر حدس‌ها · Python Pocket Lab</title>
<style>
:root{color-scheme:light;--ink:#102e32;--paper:#fffaf0;--green:#006d58;--line:#aab6aa;--gold:#ffd675;font-family:system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:#eef0e5;color:var(--ink);line-height:1.65}main{max-width:52rem;margin:auto;padding:clamp(12px,3vw,32px)}header,footer,nav,.row{display:flex;align-items:center;gap:.8rem;justify-content:space-between;flex-wrap:wrap}.brand,.mono{font:700 .83rem ui-monospace,monospace;letter-spacing:.05em}.brand{direction:ltr;display:inline-flex;gap:.55rem;align-items:center}.mark{display:inline-grid;place-items:center;background:var(--ink);color:var(--gold);border-radius:.45rem;width:2rem;height:2rem;font-size:1.2rem}h1{font-size:clamp(2rem,6vw,3.7rem);line-height:1.18;margin:1.5rem 0 .5rem}h2{font-size:clamp(1.25rem,3vw,1.8rem);line-height:1.5;margin:.7rem 0}p{margin:.5rem 0 1rem}.panel{background:var(--paper);border:1px solid var(--line);border-radius:1rem;padding:clamp(16px,4vw,32px);margin:1rem 0}.topic{font-weight:700;color:var(--green)}pre{background:var(--ink);color:#fcf7df;direction:ltr;text-align:left;padding:1.2rem;border-radius:.55rem;overflow-x:auto;line-height:1.6;font-size:clamp(.86rem,2vw,1rem);tab-size:4}button,a{font:inherit}a{color:#005c55;text-underline-offset:.18em}button{border:1px solid var(--ink);color:var(--ink);background:var(--paper);border-radius:.55rem;min-height:44px;padding:.4rem .85rem;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #a85100;outline-offset:3px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.65rem}.choices button{font:700 1rem ui-monospace,monospace;direction:ltr}.choices button:disabled{opacity:1;cursor:default}.choices .right{border:2px solid var(--green);background:#d8f1e2}.choices .wrong{border:2px dashed #a33b21;background:#fff0dc}#feedback:not(:empty){margin-top:1rem;border-inline-start:4px solid var(--green);padding-inline-start:.7rem}#next{background:var(--ink);color:white}#navmap{display:flex;flex-wrap:wrap;gap:.35rem}#navmap button{min-width:44px;padding:.3rem}#navmap [aria-current]{background:var(--gold);font-weight:bold}.rule{margin:.9rem 0;border:0;border-top:1px solid var(--line)}footer{font-size:.86rem;margin-top:1.1rem}footer p{margin:0}progress{width:100%;height:.6rem;accent-color:var(--green)}[hidden]{display:none!important}#end ul{padding-inline-start:1.5rem}#end li{margin:.5rem 0}button:disabled:not(.right):not(.wrong){cursor:default}small{font-size:.85rem}@media(max-width:420px){.choices{grid-template-columns:1fr}main{padding:12px}}
</style>
<main>
<header><div class="brand"><span class="mark">{ }</span> PYTHON POCKET LAB</div><button id="lang" type="button"></button></header>
<h1 id="title"></h1><p id="intro"></p>
<noscript>این نسخه به جاوااسکریپت نیاز دارد. <a href="https://github.com/MohammadaliMasjedi-source/a-byte-of-python-fa/blob/main/labs/PLAY.md">بازی متنی / Play without JavaScript</a></noscript>
<section class="panel" id="play">
<div class="row"><span class="topic" id="topic"></span><span id="meter"></span></div><progress id="bar" max="12" value="0"></progress>
<h2 id="question" tabindex="-1"></h2><pre><code id="code"></code></pre><p id="pick"></p><div class="choices" id="choices"></div>
<div id="feedback" role="status" aria-live="polite"></div><hr class="rule">
<nav><a id="share"></a><a id="ref" target="_blank" rel="noreferrer"></a><button id="next"></button></nav>
</section>
<section class="panel" id="end" hidden><h2 id="result" tabindex="-1"></h2><p id="recap"></p><ul id="misses"></ul><button id="again"></button></section>
<p id="maplabel"></p><div id="navmap"></div>
<footer><p id="privacy"></p><a id="project" href="https://github.com/MohammadaliMasjedi-source/a-byte-of-python-fa"></a></footer>
</main>
<script type="application/json" id="bank">[{"id":"q1","topic":["متن","Text"],"title":["یک حرف، چند بایت؟","One letter. How many bytes?"],"code":"print(len(\"آ\".encode(\"utf-8\")))","options":["1","2"],"answer":1,"why":["UTF-8 برای این حرف دو بایت لازم دارد.","UTF-8 uses two bytes for this letter. One is the number of Unicode code points before encoding."],"ref":"https://docs.python.org/3/library/stdtypes.html#str.encode"},{"id":"q2","topic":["متن","Text"],"title":["یک شکل، دو رشته؟","Two strings, one shape?"],"code":"print(\"آ\" == \"ا\" + \"\\u0653\")","options":["False","True"],"answer":0,"why":["نمایش یکسان می‌تواند از دو توالی متفاوت یونیکد ساخته شود.","The first string contains one code point. The second contains an alef and a combining mark. They can look alike without comparing equal."],"ref":"https://docs.python.org/3/library/unicodedata.html#unicodedata.normalize"},{"id":"q3","topic":["فهرست","Lists"],"title":["چند درس در نسخهٔ قدیمی ماند؟","What stayed in the old lesson list?"],"code":"lessons = [\"نور\"]\nold = lessons.copy()\nlessons.append(\"صدا\")\nprint(len(old))","options":["2","1"],"answer":1,"why":["کپی پیش از اضافه‌شدن «صدا» ساخته شده است.","The shallow copy was made before the second lesson was appended. Plain assignment would have kept both names pointing to the same list."],"ref":"https://docs.python.org/3/tutorial/datastructures.html#more-on-lists"},{"id":"q4","topic":["فهرست","Lists"],"title":["مرتب شد؛ ولی چه چیزی برگشت؟","The list is sorted. What did sort return?"],"code":"scores = [8, 2, 5]\nprint(scores.sort())","options":["[2, 5, 8]","None"],"answer":1,"why":["خود فهرست مرتب شد. متد sort مقدار تازه‌ای برنمی‌گرداند.","sort() changes the list in place and returns None. To see the sorted values, print the list afterwards."],"ref":"https://docs.python.org/3/tutorial/datastructures.html#more-on-lists"},{"id":"q5","topic":["دوربین","Camera"],"title":["کدام عکس در تساوی برنده است؟","Two frames tie. Which index wins?"],"code":"scores = [12, 19, 19, 10]\nprint(max(range(len(scores)), key=scores.__getitem__))","options":["1","2"],"answer":0,"why":["هر دو عکس امتیاز ۱۹ دارند؛ max اولین بیشینه را نگه می‌دارد.","max keeps the first maximum. Both scores are 19, but index 1 comes first."],"ref":"https://docs.python.org/3/library/functions.html#max"},{"id":"q6","topic":["دوربین","Camera"],"title":["برای سه عکس و دو برچسب چند جفت داریم؟","Three photos, two labels. How many pairs?"],"code":"print(len(list(zip([\"a\", \"b\", \"c\"], [10, 12]))))","options":["2","3"],"answer":0,"why":["با تمام‌شدن برچسب‌ها، zip عادی متوقف می‌شود.","Ordinary zip stops when the shorter input runs out. It does not invent a label for the last photo."],"ref":"https://docs.python.org/3/library/functions.html#zip"},{"id":"q7","topic":["حسگر","Sensors"],"title":["آیا اندازه‌گیری انجام شده؟","Did the sensor record anything?"],"code":"readings = [0, 0]\nprint(bool(readings), any(readings))","options":["False False","True False"],"answer":1,"why":["فهرست خالی نیست، اما هیچ عضوی مقدارِ درست ندارد.","A list with two zeroes is nonempty, so its truth value is True. Neither reading is truthy, so any returns False."],"ref":"https://docs.python.org/3/library/stdtypes.html#truth-value-testing"},{"id":"q8","topic":["متن","Text"],"title":["صفرِ اول کجا رفت؟","Where did the leading zero go?"],"code":"print(int(\"۰۷\") + 1)","options":["8","۰۸"],"answer":0,"why":["رقم‌ها برای محاسبه به عدد تبدیل شده‌اند؛ صفر اول جزو مقدار عدد نیست.","int accepts decimal digits written in Persian. The integer retains neither the spelling nor the leading zero."],"ref":"https://docs.python.org/3/library/functions.html#int"},{"id":"music","topic":["موسیقی","Music"],"title":["ضرب هفتم کجای ریتم می‌افتد؟","Where does beat seven land?"],"code":"from itertools import cycle, islice\nbar = cycle([\"DUM\", \"tak\", \"tak\"])\nprint(next(islice(bar, 6, None)))","options":["tak","DUM"],"answer":1,"why":["شش ضرب، دو دور کامل است. پس ضرب هفتم دوباره صدای اول است.","Six beats make two whole bars of three. Skipping them puts us back on the first sound."],"ref":"https://docs.python.org/3/library/itertools.html#itertools.cycle"},{"id":"pitch","topic":["گیتار","Guitar"],"title":["یک نیم‌پرده زیرِ نت مرجع، در کدام اکتاو است؟","One semitone below the reference: which octave?"],"code":"semitones = -1\nprint(semitones // 12, semitones % 12)","options":["-1 11","0 -1"],"answer":0,"why":["تقسیم صحیح به سمت منفی بی‌نهایت گرد می‌کند: منفی یک برابر است با ۱۲ ضرب‌در منفی یک، به‌علاوهٔ ۱۱.","Floor division rounds down. The octave is −1 and the position inside that octave is 11: −1 = 12 × (−1) + 11."],"ref":"https://docs.python.org/3/reference/expressions.html#binary-arithmetic-operations"},{"id":"qa","topic":["تست نرم‌افزار","Software QA"],"title":["کدام آزمایش اول رد شد؟","Which check failed first?"],"code":"passed = [True, False, False]\nprint(next(n for n, ok in enumerate(passed, 1) if not ok))","options":["1","2"],"answer":1,"why":["شماره‌گذاری این بار از یک شروع می‌شود. next فقط اولین نتیجه‌ای را می‌گیرد که False بوده است.","Numbering explicitly starts at one. next takes just the first failed check."],"ref":"https://docs.python.org/3/library/functions.html#enumerate"},{"id":"meter","topic":["اندازه‌گیری","Measurement"],"title":["دو عدد نیمه‌صحیح چطور گرد می‌شوند؟","What happens at two exact ties?"],"code":"print(round(2.5), round(3.5))","options":["2 4","3 4"],"answer":0,"why":["در این دو مقدارِ دقیقاً نیمه، round عدد زوج نزدیک‌تر را انتخاب می‌کند. این با «همیشه نیم را به بالا گرد کن» فرق دارد.","At these exactly representable ties, round chooses the even integer. That differs from rounding every half upward."],"ref":"https://docs.python.org/3/library/functions.html#round"}]</script>
<script>
'use strict';
const cards=JSON.parse(document.getElementById('bank').textContent), $=id=>document.getElementById(id);
const faen=(fa,en)=>lang==='fa'?fa:en, tr=pair=>pair[lang==='fa'?0:1], fmt=n=>n.toLocaleString(lang==='fa'?'fa-IR':'en');
let saved={};try{saved=JSON.parse(localStorage.getItem('pocket-lab-1')||'{}')||{}}catch{}
let lang=saved.lang==='en'?'en':'fa', answers=Object.create(null), current=0, summary=false;
for(const c of cards)if(saved.answers && [0,1].includes(saved.answers[c.id]))answers[c.id]=saved.answers[c.id];
function save(){try{localStorage.setItem('pocket-lab-1',JSON.stringify({lang,answers}))}catch{}}
function text(id,value){$(id).textContent=value}
function route(){const slug=location.hash.slice(1);current=Math.max(0,cards.findIndex(c=>c.id===slug));summary=slug==='result'&&Object.keys(answers).length===cards.length;draw()}
function go(slug){if(location.hash==='#'+slug)route();else location.hash=slug}
function btn(label,fn){const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=fn;return b}
function draw(){
 const c=cards[current],a=answers[c.id],done=Object.keys(answers).length,score=cards.filter(q=>answers[q.id]===q.answer).length;
 document.documentElement.lang=lang;document.documentElement.dir=lang==='fa'?'rtl':'ltr';
 text('lang',faen('English','فارسی'));$('lang').lang=lang==='fa'?'en':'fa';
 text('title',faen('دفتر حدس‌های پایتونی','The Python prediction notebook'));
 text('intro',faen('پیش از اجرای کد، خروجی را حدس بزن. هر سؤال یک امتیاز دارد؛ فقط حدس اول حساب می‌شود.','Read the code before you run it. Each puzzle is worth one point; only your first guess counts.'));
 text('topic',tr(c.topic));text('meter',faen('پاسخ‌داده: ','Answered: ')+fmt(done)+' / '+fmt(cards.length));
 $('bar').max=cards.length;$('bar').value=done;$('bar').setAttribute('aria-label',$('meter').textContent);
 text('question',fmt(current+1)+'. '+tr(c.title));text('code',c.code);text('pick',faen('چه چیزی چاپ می‌شود؟','What gets printed?'));
 $('choices').replaceChildren(...c.options.map((v,i)=>{const b=btn(v,()=>{if(answers[c.id]!==undefined)return;answers[c.id]=i;save();draw();$('next').focus()});if(a!==undefined){b.disabled=true;if(i===c.answer)b.className='right';else if(i===a)b.className='wrong'}return b}));
 text('feedback',a===undefined?'':(a===c.answer?faen('درست گفتی. ','Correct. '):faen('پاسخ درست: ','Correct output: ')+(c.options[c.answer])+' — ')+tr(c.why));
 $('share').href='https://github.com/MohammadaliMasjedi-source/a-byte-of-python-fa/blob/main/labs/'+(lang==='en'?'PLAY.en.md':current<8?'PLAY.md':'ENCORE.fa.md')+'#'+c.id; text('share',faen('لینک عمومی همین سؤال','Public link to this puzzle')); $('ref').href=c.ref;text('ref',faen('مرجع پایتون ↗','Python reference ↗'));
 text('next',done===cards.length?faen('دیدن نتیجه','See results'):a===undefined?faen('فعلاً رد شو','Skip for now'):faen('سؤال بعدی','Next puzzle'));
 $('next').onclick=()=>{if(done===cards.length)return go('result');const next=Array.from({length:cards.length},(_,i)=>cards[(current+1+i)%cards.length]).find(q=>answers[q.id]===undefined);go(next.id)};
 text('maplabel',faen('رفتن به سؤال · علامت ✓ یعنی پاسخ ثبت شده است.','Jump to a puzzle · ✓ means answered.'));
 $('navmap').replaceChildren(...cards.map((q,i)=>{const b=btn(fmt(i+1)+(answers[q.id]!==undefined?' ✓':''),()=>go(q.id));b.setAttribute('aria-label',tr(q.title)+(answers[q.id]!==undefined?faen('، پاسخ داده شده',', answered'):''));if(!summary&&current===i)b.setAttribute('aria-current','step');return b}));
 text('privacy',faen('بدون حساب و رهگیری؛ پیشرفت فقط در همین مرورگر ذخیره می‌شود، اگر اجازه بدهد.','No account or tracking. Progress stays in this browser when local storage is available.'));
 text('project',faen('کتاب، مشارکت و مجوزها ↗','Book, contributions & licenses ↗'));
 $('play').hidden=summary;$('end').hidden=!summary;
 if(summary){text('result',faen('نتیجهٔ تو: ','Your result: ')+fmt(score)+' / '+fmt(cards.length));
 text('recap',score===cards.length?faen('همه درست! حالا یکی از کدها را طوری تغییر بده که جواب دیگر درست شود.','A clean run! Change one snippet so the other answer becomes correct.'):faen('این سؤال‌ها ارزش یک نگاه دوباره دارند:','These puzzles are worth another look:'));
 $('misses').replaceChildren(...cards.filter(q=>answers[q.id]!==q.answer).map(q=>{const li=document.createElement('li'),a=document.createElement('a');a.href='#'+q.id;a.textContent=tr(q.title);li.append(a);return li}));
 text('again',faen('شروع یک دور تازه','Start a fresh round'))}
}
$('lang').onclick=()=>{lang=lang==='fa'?'en':'fa';save();draw()};
$('again').onclick=()=>{answers=Object.create(null);save();go(cards[0].id)};
window.addEventListener('hashchange',()=>{route();$(summary?'result':'question').focus()});route();
</script>
</html>
