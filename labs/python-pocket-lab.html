d(\"صدا\")\nprint(len(old))","options":["2","1"],"answer":1,"why":["کپی پیش از اضافه‌شدن «صدا» ساخته شده است.","The shallow copy was made before the second lesson was appended. Plain assignment would have kept both names pointing to the same list."],"ref":"https://docs.python.org/3/tutorial/datastructures.html#more-on-lists"},{"id":"q4","topic":["فهرست","Lists"],"title":["مرتب شد؛ ولی چه چیزی برگشت؟","The list is sorted. What did sort return?"],"code":"scores = [8, 2, 5]\nprint(scores.sort())","options":["[2, 5, 8]","None"],"answer":1,"why":["خود فهرست مرتب شد. متد sort مقدار تازه‌ای برنمی‌گرداند.","sort() changes the list in place and returns None. To see the sorted values, print the list afterwards."],"ref":"https://docs.python.org/3/tutorial/datastructures.html#more-on-lists"},{"id":"q5","topic":["دوربین","Camera"],"title":["کدام عکس در تساوی برنده است؟","Two frames tie. Which index wins?"],"code":"scores = [12, 19, 19, 10]\nprint(max(range(len(scores)), key=scores.__getitem__))","options":["1","2"],"answer":0,"why":["هر دو عکس امتیاز ۱۹ دارند؛ max اولین بیشینه را نگه می‌دارد.","max keeps the first maximum. Both scores are 19, but index 1 comes first."],"ref":"https://docs.python.org/3/library/functions.html#max"},{"id":"q6","topic":["دوربین","Camera"],"title":["برای سه عکس و دو برچسب چند جفت داریم؟","Three photos, two labels. How many pairs?"],"code":"print(len(list(zip([\"a\", \"b\", \"c\"], [10, 12]))))","options":["2","3"],"answer":0,"why":["با تمام‌شدن برچسب‌ها، zip عادی متوقف می‌شود.","Ordinary zip stops when the shorter input runs out. It does not invent a label for the last photo."],"ref":"https://docs.python.org/3/library/functions.html#zip"},{"id":"q7","topic":["حسگر","Sensors"],"title":["آیا اندازه‌گیری انجام شده؟","Did the sensor record anything?"],"code":"readings = [0, 0]\nprint(bool(readings), any(readings))","options":["False False","True False"],"answer":1,"why":["فهرست خالی نیست، اما هیچ عضوی مقدارِ درست ندارد.","A list with two zeroes is nonempty, so its truth value is True. Neither reading is truthy, so any returns False."],"ref":"https://docs.python.org/3/library/stdtypes.html#truth-value-testing"},{"id":"q8","topic":["متن","Text"],"title":["صفرِ اول کجا رفت؟","Where did the leading zero go?"],"code":"print(int(\"۰۷\") + 1)","options":["8","۰۸"],"answer":0,"why":["رقم‌ها برای محاسبه به عدد تبدیل شده‌اند؛ صفر اول جزو مقدار عدد نیست.","int accepts decimal digits written in Persian. The integer retains neither the spelling nor the leading zero."],"ref":"https://docs.python.org/3/library/functions.html#int"},{"id":"music","topic":["موسیقی","Music"],"title":["ضرب هفتم کجای ریتم می‌افتد؟","Where does beat seven land?"],"code":"from itertools import cycle, islice\nbar = cycle([\"DUM\", \"tak\", \"tak\"])\nprint(next(islice(bar, 6, None)))","options":["tak","DUM"],"answer":1,"why":["شش ضرب، دو دور کامل است. پس ضرب هفتم دوباره صدای اول است.","Six beats make two whole bars of three. Skipping them puts us back on the first sound."],"ref":"https://docs.python.org/3/library/itertools.html#itertools.cycle"},{"id":"pitch","topic":["گیتار","Guitar"],"title":["یک نیم‌پرده زیرِ نت مرجع، در کدام اکتاو است؟","One semitone below the reference: which octave?"],"code":"semitones = -1\nprint(semitones // 12, semitones % 12)","options":["-1 11","0 -1"],"answer":0,"why":["تقسیم صحیح به سمت منفی بی‌نهایت گرد می‌کند: منفی یک برابر است با ۱۲ ضرب‌در منفی یک، به‌علاوهٔ ۱۱.","Floor division rounds down. The octave is −1 and the position inside that octave is 11: −1 = 12 × (−1) + 11."],"ref":"https://docs.python.org/3/reference/expressions.html#binary-arithmetic-operations"},{"id":"qa","topic":["تست نرم‌افزار","Software QA"],"title":["کدام آزمایش اول رد شد؟","Which check failed first?"],"code":"passed = [True, False, False]\nprint(next(n for n, ok in enumerate(passed, 1) if not ok))","options":["1","2"],"answer":1,"why":["شماره‌گذاری این بار از یک شروع می‌شود. next فقط اولین نتیجه‌ای را می‌گیرد که False بوده است.","Numbering explicitly <script>
'use strict';
const cards=JSON.parse(document.getElementById('bank').textContent), $=id=>document.getElementById(id);
const faen=(fa,en)=>lang==='fa'?fa:en, tr=pair=>pair[lang==='fa'?0:1], fmt=n=>n.toLocaleString(lang==='fa'?'fa-IR':'en');
let saved={};try{saved=JSON.parse(localStorage.getItem('pocket-lab-1')||'{}')||{}}catch{}
let lang=saved.lang==='en'?'en':'fa', answers=Object.create(null), current=0, summary=false;
for(const c of cards)if(saved.answers && [0,1].includes(saved.answers[c.id]))answers[c.id]=saved.answers[c.id];

function text(id,value){$(id).textContent=value}
function route(){const slug=location.hash.slice(1);current=Math.max(0,cards.findIndex(c=>c.id===slug));summary=slug==='result'&&Object.keys(answers).length===cards.length;draw()}
function go(slug){if(location.hash==='#'+slug)route();else location.hash=slug}
function btn(label,fn){const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=fn;return b}
let lastCard=null,variantGuesses=Object.create(null);
function draw(){
 const c=cards[current],a=answers[c.id],done=Object.keys(answers).length,score=cards.filter(q=>answers[q.id]===q.answer).length;
 document.documentElement.lang=lang;document.documentElement.dir=lang==='fa'?'rtl':'ltr';
 text('lang',faen('English','فارسی'));$('lang').lang=lang==='fa'?'en':'fa';
 text('series',faen('چهار آزمایش مصور + دوازده معمای کوتاه','Four illustrated experiments + twelve quick puzzles')); text('title',faen('آزمایشگاه مصور پایتون','Python Pocket Lab'));
 text('intro',faen('خروجی را حدس بزن، رد اجرا را در شکل ببین و یک خط را عوض کن. فقط حدس اول در امتیاز هر سؤال حساب می‌شود.','Predict the output, trace the diagram, then change one line. Only your first prediction counts toward the score.'));
 text('topic',tr(c.topic));text('meter',faen('پاسخ‌داده: ','Answered: ')+fmt(done)+' / '+fmt(cards.length));
 $('bar').max=cards.length;$('bar').value=done;$('bar').setAttribute('aria-label',$('meter').textContent);
 text('question',fmt(current+1)+'. '+tr(c.title));text('code',c.code);text('pick',faen('چه چیزی چاپ می‌شود؟','What gets printed?'));
 $('choices').replaceChildren(...c.options.map((v,i)=>{const b=btn(v,()=>{if(answers[c.id]!==undefined)return;answers[c.id]=i;save();draw();$('next').focus()});if(a!==undefined){b.disabled=true;if(i===c.answer)b.className='right';else if(i===a)b.className='wrong'}return b}));
 text('feedback',a===undefined?'':(a===c.answer?faen('درست گفتی. ','Correct. '):faen('پاسخ درست: ','Correct output: ')+(c.options[c.answer])+' — ')+tr(c.why));
 const visible=a!==undefined&&!!c.image;
 $('art').hidden=$('trap').hidden=$('bench').hidden=!visible;
 if(lastCard!==c.id){$('bench').open=false;lastCard=c.id}
 if(visible){$('diagram').src=c.image;$('diagram').alt=tr(c.alt);text('caption',tr(c.alt));text('trap',faen('چرا گزینهٔ دیگر وسوسه‌کننده است؟ ','Why the other choice is tempting: ')+tr(c.misconception));text('bench-label',faen('آزمایش دوم: یک تغییر','Second experiment: change one thing'));text('challenge',tr(c.experiment));text('changed-code',c.variant);
 const guess=variantGuesses[c.id];$('variant-choices').replaceChildren(...c.options.map((v,i)=>{const b=btn(v,()=>{variantGuesses[c.id]=i;draw()});b.dir='ltr';b.setAttribute('aria-pressed',String(guess===i));return b}));text('outcome',guess===undefined?'':guess===c.variant_answer?faen('✓ درست است. خروجی جدید: ','✓ Correct. New output: ')+c.options[guess]:faen('↻ هنوز نه. سطر تغییریافته را دنبال کن و دوباره امتحان کن.','↻ Not yet. Trace the changed line and try again.'))}
 else{$('diagram').removeAttribute('src');$('diagram').alt='';text('caption','');text('trap','');text('outcome','')}
  $('share').href='https://github.com/MohammadaliMasjedi-source/a-byte-of-python-fa/blob/main/labs/'+(lang==='en'?'PLAY.en.md':['music','pitch','qa','meter'].includes(c.id)?'ENCORE.fa.md':'PLAY.md')+'#'+c.id; text('share',faen('لینک عمومی همین سؤال','Public link to this puzzle')); $('ref').href=c.ref;text('ref',faen('مرجع پایتون ↗','Python reference ↗'));
 text('next',done===cards.length?faen('دیدن نتیجه','See results'):a===undefined?faen('فعلاً رد شو','Skip for now'):faen('سؤال بعدی','Next puzzle'));
 $('next').onclick=()=>{if(done===cards.length)return go('result');const next=Array.from({length:cards.length},(_,i)=>cards[(current+1+i)%cards.length]).find(q=>answers[q.id]===undefined);go(next.id)};
 text('maplabel',faen('نقشهٔ حدس اول: ✓ درست، × نیاز به مرور، · هنوز جواب نداده‌ای.','Your first guesses: ✓ correct, × revisit, · unanswered.'));
 $('navmap').replaceChildren(...cards.map((q,i)=>{const state=answers[q.id]===undefined?'open':answers[q.id]===q.answer?'right':'wrong',tag={open:' ·',right:' ✓',wrong:' ×'}[state];const b=btn(fmt(i+1)+tag,()=>go(q.id));b.dataset.status=state;b.setAttribute('aria-label',tr(q.title)+' — '+({open:faen('بی‌پاسخ','unanswered'),right:faen('درست','correct'),wrong:faen('نیاز به مرور','revisit')})[state]);if(!summary&&current===i)b.setAttribute('aria-current','step');return b}));
 text('privacy',faen('بازی حساب کاربری نمی‌خواهد. امتیاز تو فقط در همین مرورگر ذخیره می‌شود، اگر اجازه بدهد.','The game needs no account. Progress stays in this browser when local storage is available.'));
 text('club',faen('پیشنهاد معما و دنبال‌کردن شمارهٔ بعد ↗','Suggest a puzzle or subscribe to the next edition ↗'));text('project',faen('کتاب، مشارکت و مجوزها ↗','Book, contributions & licenses ↗'));
 $('play').hidden=summary;$('end').hidden=!summary;
 if(summary){text('result',faen('نتیجهٔ تو: ','Your result: ')+fmt(score)+' / '+fmt(cards.length));
 text('recap',score===cards.length?faen('همه درست! حالا یکی از کدها را طوری تغییر بده که جواب دیگر درست شود.','A clean run! Change one snippet so the other answer becomes correct.'):faen('این سؤال‌ها ارزش یک نگاه دوباره دارند:','These puzzles are worth another look:'));
 $('misses').replaceChildren(...cards.filter(q=>answers[q.id]!==q.answer).map(q=>{const li=document.createElement('li'),a=document.createElement('a');a.href='#'+q.id;a.textContent=tr(q.title);li.append(a);return li}));
 text('again',faen('شروع یک دور تازه','Start a fresh round'))}
}
$('lang').onclick=()=>{lang=lang==='fa'?'en':'fa';save();draw()};
$('again').onclick=()=>{answers=Object.create(null);variantGuesses=Object.create(null);save();go(cards[0].id)};
window.addEventListener('hashchange',()=>{route();$(summary?'result':'question').focus()});route();
</script>
