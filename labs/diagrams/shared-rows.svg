<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" role="img" aria-labelledby="shared-rows-title shared-rows-desc">
<title id="shared-rows-title">How did one move change three rows?</title><desc id="shared-rows-desc">Three arrows from grid[0], grid[1], and grid[2] converge on one row. Its second slot now holds 7.</desc>
<defs><marker id="shared-rows-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#47716b"/></marker></defs>
<rect x="2" y="2" width="556" height="276" rx="18" fill="#f5f8f4" stroke="#c3d2c9" stroke-width="1.6"/>
<text x="22" y="36" fill="#143b38" font-family="system-ui,sans-serif" font-size="17" font-weight="600" text-anchor="start">ONE OUTER LIST</text><text x="292" y="36" fill="#143b38" font-family="system-ui,sans-serif" font-size="17" font-weight="600" text-anchor="start">ONE INNER LIST</text><rect x="23" y="53" width="125" height="44" rx="12" fill="#ffffff" stroke="#becfc9" stroke-width="1.6"/><text x="85" y="82" fill="#143b38" font-family="monospace" font-size="21" font-weight="600" text-anchor="middle">grid[0]</text><path d="M149 75 C211 75 215 143 274 143" fill="none" stroke="#47716b" stroke-width="3" marker-end="url(#shared-rows-arrow)"/><rect x="23" y="121" width="125" height="44" rx="12" fill="#ffffff" stroke="#becfc9" stroke-width="1.6"/><text x="85" y="150" fill="#143b38" font-family="monospace" font-size="21" font-weight="600" text-anchor="middle">grid[1]</text><path d="M149 143 C211 143 215 143 274 143" fill="none" stroke="#47716b" stroke-width="3" marker-end="url(#shared-rows-arrow)"/><rect x="23" y="189" width="125" height="44" rx="12" fill="#ffffff" stroke="#becfc9" stroke-width="1.6"/><text x="85" y="218" fill="#143b38" font-family="monospace" font-size="21" font-weight="600" text-anchor="middle">grid[2]</text><path d="M149 211 C211 211 215 143 274 143" fill="none" stroke="#47716b" stroke-width="3" marker-end="url(#shared-rows-arrow)"/><rect x="282" y="100" width="249" height="88" rx="12" fill="#e0eee7" stroke="#47716b" stroke-width="1.6"/><text x="304" y="128" fill="#143b38" font-family="monospace" font-size="18" font-weight="600" text-anchor="start">row</text><rect x="304" y="140" width="83" height="35" rx="12" fill="#ffffff" stroke="#becfc9" stroke-width="1.6"/><rect x="406" y="140" width="92" height="35" rx="12" fill="#ffdc92" stroke="#946026" stroke-width="1.6"/><text x="346" y="165" fill="#143b38" font-family="monospace" font-size="22" font-weight="600" text-anchor="middle">0</text><text x="452" y="165" fill="#143b38" font-family="monospace" font-size="22" font-weight="600" text-anchor="middle">7</text><text x="24" y="260" fill="#143b38" font-family="system-ui,sans-serif" font-size="18" font-weight="600" text-anchor="start">3 slots</text><text x="292" y="222" fill="#143b38" font-family="system-ui,sans-serif" font-size="15" font-weight="600" text-anchor="start">One write changes this object.</text>
</svg>
