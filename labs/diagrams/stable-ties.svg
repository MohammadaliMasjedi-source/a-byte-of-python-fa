<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" role="img" aria-labelledby="stable-ties-title stable-ties-desc">
<title id="stable-ties-title">Two samples tie. Which one comes first?</title><desc id="stable-ties-desc">Arrows trace C/8 and B/8 to the first two output slots in original order. A/6 moves to the last slot.</desc>
<defs><marker id="stable-ties-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#47716b"/></marker></defs>
<rect x="2" y="2" width="556" height="276" rx="18" fill="#f5f8f4" stroke="#c3d2c9" stroke-width="1.6"/>
