ont-size="22" font-weight="600" text-anchor="middle">8</text><rect x="320" y="114" width="183" height="44" rx="12" fill="#dfece5" stroke="#becfc9" stroke-width="1.6"/><text x="341" y="144" fill="#143b38" font-family="monospace" font-size="23" font-weight="600" text-anchor="start">B</text><text x="465" y="144" fill="#143b38" font-family="monospace" font-size="22" font-weight="600" text-anchor="middle">8</text><rect x="320" y="177" width="183" height="44" rx="12" fill="#f9ecd6" stroke="#becfc9" stroke-width="1.6"/><text x="341" y="207" fill="#143b38" font-family="monospace" font-size="23" font-weight="600" text-anchor="start">A</text><text x="465" y="207" fill="#143b38" font-family="monospace" font-size="22" font-weight="600" text-anchor="middle">6</text><text x="24" y="256" fill="#143b38" font-family="system-ui,sans-serif" font-size="18" font-weight="600" text-anchor="start">Equal scores: C still precedes B.</text>
