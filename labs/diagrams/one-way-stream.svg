<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" role="img" aria-labelledby="one-way-stream-title one-way-stream-desc">
<title id="one-way-stream-title">What is left of the melody on a second pass?</title><desc id="one-way-stream-desc">The sequence of return values is A, then [B, C], then an empty list.</desc>
<defs><marker id="one-way-stream-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#47716b"/></marker></defs>
<rect x="2" y="2" width="556" height="276" rx="18" fill="#f5f8f4" stroke="#c3d2c9" stroke-width="1.6"/>
<text x="22" y="35" fill="#143b38" font-family="system-ui,sans-serif" font-size="17" font-weight="600" text-anchor="start">ONE ITERATOR, THREE READS</text><rect x="23" y="56" width="37" height="42" rx="12" fill="#143b38" stroke="#143b38" stroke-width="1.6"/><text x="41" y="84" fill="white" font-family="system-ui,sans-serif" font-size="20" font-weight="600" text-anchor="middle">1</text><text x="78" y="85" fill="#143b38" font-family="monospace" font-size="19" font-weight="600" text-anchor="start">next(notes)</text><path d="M237 76 H277" fill="none" stroke="#47716b" stroke-width="3" marker-end="url(#one-way-stream-arrow)"/><rect x="292" y="56" width="238" height="42" rx="12" fill="#dfece5" stroke="#becfc9" stroke-width="1.6"/><text x="410" y="84" fill="#143b38" font-family="monospace" font-size="22" font-weight="600" text-anchor="middle">&quot;A&quot;</text><rect x="23" y="124" width="37" height="42" rx="12" fill="#143b38" stroke="#143b38" stroke-width="1.6"/><text x="41" y="152" fill="white" font-family="system-ui,sans-serif" font-size="20" font-weight="600" text-anchor="middle">2</text><text x="78" y="153" fill="#143b38" font-family="monospace" font-size="19" font-weight="600" text-anchor="start">list(notes)</text><path d="M237 144 H277" fill="none" stroke="#47716b" stroke-width="3" marker-end="url(#one-way-stream-arrow)"/><rect x="292" y="124" width="238" height="42" rx="12" fill="#dfece5" stroke="#becfc9" stroke-width="1.6"/><text x="410" y="152" fill="#143b38" font-family="monospace" font-size="22" font-weight="600" text-anchor="middle">[&#x27;B&#x27;, &#x27;C&#x27;]</text><rect x="23" y="192" width="37" height="42" rx="12" fill="#143b38" stroke="#143b38" stroke-width="1.6"/><text x="41" y="220" fill="white" font-family="system-ui,sans-serif" font-size="20" font-weight="600" text-anchor="middle">3</text><text x="78" y="221" fill="#143b38" font-family="monospace" font-size="19" font-weight="600" text-anchor="start">list(notes)</text><path d="M237 212 H277" fill="none" stroke="#47716b" stroke-width="3" marker-end="url(#one-way-stream-arrow)"/><rect x="292" y="192" width="238" height="42" rx="12" fill="#ffebc2" stroke="#becfc9" stroke-width="1.6"/><text x="410" y="220" fill="#143b38" font-family="monospace" font-size="22" font-weight="600" text-anchor="middle">[]</text><text x="24" y="261" fill="#143b38" font-family="system-ui,sans-serif" font-size="18" font-weight="600" text-anchor="start">A → B → C → end</text>
