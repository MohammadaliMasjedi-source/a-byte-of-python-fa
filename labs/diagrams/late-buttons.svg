<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" role="img" aria-labelledby="late-buttons-title late-buttons-desc">
<title id="late-buttons-title">Three buttons. Why do they all say the same number?</title><desc id="late-buttons-desc">Three callback arrows point to one shared binding, whose final value after the loop is 3.</desc>
<defs><marker id="late-buttons-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#47716b"/></marker></defs>
<rect x="2" y="2" width="556" height="276" rx="18" fill="#f5f8f4" stroke="#c3d2c9" stroke-width="1.6"/>
<text x="23" y="35" fill="#143b38" font-family="system-ui,sans-serif" font-size="17" font-weight="600" text-anchor="start">SET UP BUTTONS</text><text x="305" y="35" fill="#143b38" font-family="system-ui,sans-serif" font-size="17" font-weight="600" text-anchor="start">CLICK AFTER THE LOOP</text><rect x="26" y="52" width="145" height="42" rx="12" fill="#ffffff" stroke="#becfc9" stroke-width="1.6"/><text x="99" y="80" fill="#143b38" font-family="monospace" font-size="20" font-weight="600" text-anchor="middle">button 1</text><path d="M172 73 C226 73 236 132 284 132" fill="none" stroke="#47716b" stroke-width="3" marker-end="url(#late-buttons-arrow)"/><rect x="26" y="113" width="145" height="42" rx="12" fill="#ffffff" stroke="#becfc9" stroke-width="1.6"/><text x="99" y="141" fill="#143b38" font-family="monospace" font-size="20" font-weight="600" text-anchor="middle">button 2</text><path d="M172 134 C226 134 236 132 284 132" fill="none" stroke="#47716b" stroke-width="3" marker-end="url(#late-buttons-arrow)"/><rect x="26" y="174" width="145" height="42" rx="12" fill="#ffffff" stroke="#becfc9" stroke-width="1.6"/><text x="99" y="202" fill="#143b38" font-family="monospace" font-size="20" font-weight="600" text-anchor="middle">button 3</text><path d="M172 195 C226 195 236 132 284 132" fill="none" stroke="#47716b" stroke-width="3" marker-end="url(#late-buttons-arrow)"/><rect x="292" y="93" width="229" height="80" rx="12" fill="#ffebc2" stroke="#946026" stroke-width="1.6"/><text x="406" y="126" fill="#143b38" font-family="system-ui,sans-serif" font-size="19" font-weight="600" text-anchor="middle">shared name</text><text x="406" y="157" fill="#143b38" font-family="monospace" font-size="23" font-weight="600" text-anchor="middle">n = 3</text><text x="26" y="253" fill="#143b38" font-family="system-ui,sans-serif" font-size="18" font-weight="600" text-anchor="start">Every click reads the same binding.</text>
</svg>
